name: Dependency audit

on:
  push:
    branches: [main, develop]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    branches: [main, develop]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Moderate-or-higher advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          package-manager-cache: false
      - name: Enable the pinned pnpm version
        run: corepack enable
      - name: Verify the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit registry advisories
        run: pnpm audit --audit-level=moderate
