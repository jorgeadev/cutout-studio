name: Documentation improvement
description: Report missing, incorrect, or unclear project documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I checked the latest version of the documentation.
          required: true
        - label: I searched for an existing issue covering this change.
          required: true

  - type: dropdown
    id: location
    attributes:
      label: Documentation area
      options:
        - README
        - Contributing guide
        - Security or support policy
        - Code comments or types
        - User interface copy
        - Deployment instructions
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Include the relevant file, heading, screen, or URL.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Explain what the documentation should say or show instead.
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this documentation change.

  - type: checkboxes
    id: conduct
    attributes:
      label: Community agreement
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
